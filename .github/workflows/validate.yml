name: Validate Skills

on:
  push:
    paths: ['skills/**', 'tools/validate.py', 'tests/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['skills/**', 'tools/validate.py', 'tests/**', '.github/workflows/validate.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml duckdb
      - run: python tools/validate.py
      - run: python -c "import duckdb; print('DuckDB', duckdb.__version__)"
      - run: python -m unittest discover -s tests -v

  build-registry:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: |
          python tools/build_registry.py
          python tools/build_site.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json docs/index.html
          git diff --cached --quiet || git commit -m "chore: auto-update registry.json + catalog site"
          git push
